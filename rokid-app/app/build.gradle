plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rokiddemo.glasses'
    compileSdk 34

    defaultConfig {
        applicationId "com.rokiddemo.glasses"
        // Rokid Glasses run YodaOS (Android 12 / API 31-32). minSdk 26 keeps it
        // testable on almost any spare Android phone as well.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // WebSocket client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
